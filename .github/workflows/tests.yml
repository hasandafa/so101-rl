name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU only, no PyTorch needed for these tests)
        run: pip install "mujoco>=3.2" numpy pytest
      - name: Run tests
        run: python -m pytest -q tests
