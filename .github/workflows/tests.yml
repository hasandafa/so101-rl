name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04  # same Ubuntu release as the dev machine (Pop!_OS 24.04)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU only, no PyTorch needed for these tests)
        run: pip install "mujoco>=3.2" numpy pytest
      - name: Run tests
        run: python -m pytest -q tests
